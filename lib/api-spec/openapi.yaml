openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: 관리자 파일 업로드와 저장 파일 제공
  - name: Assignments
    description: 레벨별 학습 과제 등록과 조회
  - name: OpenAI
    description: AI 기반 학습 지원
  - name: Reading
    description: 읽기 이해 지문과 문제
paths:
  /reading/passages:
    get:
      operationId: listReadingPassages
      tags: [Reading]
      summary: 저장된 읽기 이해 지문 조회
      parameters:
        - in: query
          name: grade
          required: true
          schema:
            type: integer
            enum: [6]
      responses:
        "200":
          description: 저장된 지문 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadingPassage"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/reading/passages:
    get:
      operationId: listAdminReadingPassages
      tags: [Reading]
      summary: 관리자용 읽기 지문 목록
      responses:
        "200":
          description: 저장된 지문 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadingPassage"
    post:
      operationId: saveReadingPassage
      tags: [Reading]
      summary: 검토한 지문과 문제 저장
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveReadingPassageInput"
      responses:
        "201":
          description: 저장 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingPassage"
  /admin/reading/passages/generate:
    post:
      operationId: generateReadingQuestions
      tags: [Reading]
      summary: 지문 기반 읽기 이해 문제 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateReadingQuestionsInput"
      responses:
        "200":
          description: 검토용 문제
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadingQuestion"
        "503":
          description: AI 서비스 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /reading/passages/{passageId}/short-answer:
    post:
      operationId: gradeReadingShortAnswer
      tags: [Reading]
      summary: 저장된 지문과 정답을 기준으로 짧은 답 채점
      parameters:
        - in: path
          name: passageId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeReadingShortAnswerInput"
      responses:
        "200":
          description: 채점 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeReadingShortAnswerResult"
        "503":
          description: AI 서비스 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /openai/translations:
    post:
      operationId: translatePracticeSentences
      tags: [OpenAI]
      summary: 영어 연습 문장을 자연스러운 한국어로 번역
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslatePracticeSentencesRequest"
      responses:
        "200":
          description: 입력 순서와 같은 한국어 번역 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KoreanTranslationsEnvelope"
        "400":
          description: 잘못된 문장 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      summary: 관리자용 파일 업로드 주소 발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: 업로드 주소가 발급됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: 잘못된 파일 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 관리자 권한이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/status:
    get:
      operationId: getAdminStatus
      tags: [Storage]
      summary: 현재 로그인 사용자의 관리자 권한 확인
      responses:
        "200":
          description: 관리자 권한 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /assignments:
    get:
      operationId: listAssignments
      tags: [Assignments]
      summary: 현재 레벨에 배정된 공개 과제 조회
      parameters:
        - name: level
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/LearningLevel"
      responses:
        "200":
          description: 공개 과제 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
        "400":
          description: 잘못된 레벨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /assignments/progress:
    get:
      operationId: listAssignmentProgress
      tags: [Assignments]
      summary: 현재 로그인 사용자의 과제별 진행률 조회
      responses:
        "200":
          description: 과제 진행률 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignmentProgress"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /assignments/{assignmentId}/progress:
    put:
      operationId: upsertAssignmentProgress
      tags: [Assignments]
      summary: 현재 과제의 진행률 저장
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentProgressInput"
      responses:
        "200":
          description: 진행률 저장 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentProgress"
        "400":
          description: 올바르지 않은 진행률
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 해당 과제에 접근할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: 과제를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/assignments:
    get:
      operationId: listAdminAssignments
      tags: [Assignments]
      summary: 관리자가 전체 과제 조회
      responses:
        "200":
          description: 전체 과제 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 관리자 권한이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createAssignment
      tags: [Assignments]
      summary: 레벨별 과제 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
      responses:
        "201":
          description: 과제가 등록됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          description: 잘못된 과제 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 관리자 권한이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/library-materials:
    get:
      operationId: listAdminLibraryMaterials
      tags: [Assignments]
      summary: 관리자의 저장 콘텐츠 목록 조회
      responses:
        "200":
          description: 저장 콘텐츠 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryMaterial"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 관리자 권한이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createAdminLibraryMaterial
      tags: [Assignments]
      summary: 콘텐츠 보관함에 자료 저장
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryMaterialInput"
      responses:
        "201":
          description: 콘텐츠가 저장됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryMaterial"
        "400":
          description: 잘못된 콘텐츠 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 관리자 권한이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/library-materials/{materialId}:
    delete:
      operationId: deleteAdminLibraryMaterial
      tags: [Assignments]
      summary: 저장 콘텐츠 삭제
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: 콘텐츠가 삭제됨
        "400":
          description: 잘못된 콘텐츠 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 관리자 권한이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: 저장 콘텐츠를 찾지 못함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/assignment-folders:
    get:
      operationId: listAdminAssignmentFolders
      tags: [Assignments]
      summary: 관리자의 학습자료 하위 폴더 목록 조회
      responses:
        "200":
          description: 학습자료 하위 폴더 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignmentFolder"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 관리자 권한이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createAssignmentFolder
      tags: [Assignments]
      summary: 문장 또는 단어 자료 하위 폴더 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentFolderInput"
      responses:
        "201":
          description: 하위 폴더가 생성됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentFolder"
        "400":
          description: 잘못된 폴더 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 관리자 권한이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: 같은 자료 유형에 같은 이름의 폴더가 이미 있음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/members:
    get:
      operationId: listAdminMembers
      tags: [Assignments]
      summary: 과제 배정을 위한 회원 목록 조회
      responses:
        "200":
          description: 회원 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignmentMember"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 관리자 권한이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/member-classes:
    get:
      operationId: listAdminMemberClasses
      tags: [Assignments]
      summary: 과정별 반 폴더 목록
      responses:
        "200":
          description: 반 폴더 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberClass"
    post:
      operationId: createAdminMemberClass
      tags: [Assignments]
      summary: 과정 안에 반 폴더 만들기
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberClassInput"
      responses:
        "201":
          description: 반 폴더 생성
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberClass"
        "400":
          description: 잘못된 과정 또는 상위 폴더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/members/{memberId}/class:
    put:
      operationId: updateMemberClass
      tags: [Assignments]
      summary: 회원을 반 폴더에 배치하거나 다른 반으로 이동
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberClassAssignmentInput"
      responses:
        "200":
          description: 회원 배치 갱신
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberClassAssignment"
        "400":
          description: 과정이 다른 반 폴더
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/members/{memberId}:
    delete:
      operationId: deleteAdminMember
      tags: [Assignments]
      summary: 회원 계정과 연결된 과정 및 개인 과제 삭제
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: 회원 계정과 연결 자료가 삭제됨
        "400":
          description: 잘못된 회원 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 관리자 계정 또는 현재 로그인 계정은 삭제할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: 회원 계정을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: 회원 삭제 또는 연결 자료 정리 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/members/{memberId}/course:
    put:
      operationId: updateMemberCourse
      tags: [Assignments]
      summary: 회원의 학습 과정 배정 또는 변경
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberCourseInput"
      responses:
        "200":
          description: 회원의 학습 과정이 갱신됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberCourseAssignment"
        "400":
          description: 잘못된 과정 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 관리자 권한이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: 회원을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/assignments/{assignmentId}:
    delete:
      operationId: deleteAssignment
      tags: [Assignments]
      summary: 등록한 과제 삭제
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: 과제가 삭제됨
        "400":
          description: 잘못된 과제 번호
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 관리자 권한이 필요함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: 과제를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /learning-content:
    get:
      operationId: getLearningContent
      tags: [LearningContent]
      summary: 현재 과정의 배우기 콘텐츠 조회
      parameters:
        - name: level
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/LearningContentLevel"
      responses:
        "200":
          description: 배우기 콘텐츠
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningContent"
        "400":
          description: 잘못된 과정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 로그인이 필요함
          content:
            application/json:
              schema:
