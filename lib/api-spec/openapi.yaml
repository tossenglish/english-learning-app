              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    ReadingQuestion:
      type: object
      required: [type, prompt, options, answer]
      properties:
        type:
          type: string
          enum: [true_false, multiple_choice, short_answer]
        prompt:
          type: string
        options:
          type: array
          items:
            type: string
        answer:
          type: string
    ReadingPassage:
      type: object
      required: [id, grade, title, passage, questions, createdAt]
      properties:
        id:
          type: integer
        grade:
          type: integer
        title:
          type: string
        passage:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/ReadingQuestion"
        createdAt:
          type: string
          format: date-time
    GenerateReadingQuestionsInput:
      type: object
      required: [grade, passage]
      properties:
        grade:
          type: integer
          enum: [6]
        passage:
          type: string
          minLength: 30
          maxLength: 3000
    SaveReadingPassageInput:
      type: object
      required: [grade, title, passage, questions]
      properties:
        grade:
          type: integer
          enum: [6]
        title:
          type: string
          minLength: 1
          maxLength: 160
        passage:
          type: string
          minLength: 30
          maxLength: 3000
        questions:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/ReadingQuestion"
    GradeReadingShortAnswerInput:
      type: object
      required: [questionIndex, answer]
      properties:
        questionIndex:
          type: integer
          minimum: 0
          maximum: 2
        answer:
          type: string
          minLength: 1
          maxLength: 240
    GradeReadingShortAnswerResult:
      type: object
      required: [correct, feedback]
      properties:
        correct:
          type: boolean
        feedback:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TranslatePracticeSentencesRequest:
      type: object
      required: [sentences]
      properties:
        sentences:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
    KoreanTranslationsEnvelope:
      type: object
      required: [translations]
      properties:
        translations:
          type: array
          items:
            type: string
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
          maximum: 5368709120
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    AdminStatus:
      type: object
      required: [isAdmin]
      properties:
        isAdmin:
          type: boolean
    HomeVideoSettings:
      type: object
      required: [videoId, youtubeUrl, objectPath, streamUrl, resourceName]
      properties:
        videoId:
          type: [string, "null"]
          maxLength: 11
        youtubeUrl:
          type: [string, "null"]
          format: uri
        objectPath:
          type: [string, "null"]
          maxLength: 1024
        streamUrl:
          type: [string, "null"]
          format: uri
          maxLength: 2048
        resourceName:
          type: [string, "null"]
          maxLength: 255
    HomeVideoSettingsInput:
      type: object
      required: [objectPath, streamUrl, resourceName]
      properties:
        objectPath:
          type: [string, "null"]
          maxLength: 1024
        streamUrl:
          type: [string, "null"]
          format: uri
          maxLength: 2048
        resourceName:
          type: [string, "null"]
          maxLength: 255
    LearningLevel:
      type: string
      enum: [Beginner, Intermediate, Advanced, All]
    LearningContentLevel:
      type: string
      enum: [Beginner, Intermediate, Advanced]
    LearningContent:
      type: object
      required:
        [id, level, word, pronunciation, partOfSpeech, shortMeaning, meaningDetail, englishDefinition, exampleSentence, exampleKorean, quizOptions, correctMeaning, tip, createdAt, updatedAt]
      properties:
        id:
          type: integer
        level:
          $ref: "#/components/schemas/LearningContentLevel"
        word:
          type: string
        pronunciation:
          type: string
        partOfSpeech:
          type: string
        shortMeaning:
          type: string
        meaningDetail:
          type: string
        englishDefinition:
          type: string
        exampleSentence:
          type: string
        exampleKorean:
          type: string
        quizOptions:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: string
        correctMeaning:
          type: string
        tip:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LearningContentInput:
      type: object
      required:
        [word, pronunciation, partOfSpeech, shortMeaning, meaningDetail, englishDefinition, exampleSentence, exampleKorean, quizOptions, correctMeaning, tip]
      properties:
        word:
          type: string
          minLength: 1
          maxLength: 120
        pronunciation:
          type: string
          maxLength: 120
        partOfSpeech:
          type: string
          maxLength: 40
        shortMeaning:
          type: string
          minLength: 1
          maxLength: 200
        meaningDetail:
          type: string
          maxLength: 1000
        englishDefinition:
          type: string
          maxLength: 1000
        exampleSentence:
          type: string
          maxLength: 1000
        exampleKorean:
          type: string
          maxLength: 1000
        quizOptions:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: string
            minLength: 1
            maxLength: 200
        correctMeaning:
          type: string
          minLength: 1
          maxLength: 200
        tip:
          type: string
          maxLength: 1000
    LearningContentBatch:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/LearningContentBatchItem"
    LearningContentBatchItem:
      type: object
      required: [level, content]
      properties:
        level:
          $ref: "#/components/schemas/LearningContentLevel"
        content:
          $ref: "#/components/schemas/LearningContentInput"
    Assignment:
      type: object
      required: [id, title, description, materialType, folderId, materialContent, level, isPublished, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        materialType:
          $ref: "#/components/schemas/MaterialType"
        folderId:
          type: [integer, "null"]
        materialContent:
          type: string
        level:
          $ref: "#/components/schemas/LearningLevel"
        assigneeUserId:
          type: [string, "null"]
        assigneeName:
          type: [string, "null"]
        dueDate:
          type: [string, "null"]
        resourcePath:
          type: [string, "null"]
        resourceName:
          type: [string, "null"]
        isPublished:
          type: boolean
        createdAt:
          type: string
          format: date-time
    AssignmentProgress:
      type: object
